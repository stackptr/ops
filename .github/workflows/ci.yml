name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.zx.dev/main
            extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=

      - name: Build Terranix config
        run: nix build .#terraformConfiguration -o tofu/config.tf.json

  # Only main gets ATTIC_TOKEN, from the main-only `attic` environment: branch
  # code never runs with it around. The client comes from a fixed rev, not
  # the flake's lock, so a lock change can't swap it; bump it by hand.
  cache:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: attic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.zx.dev/main
            extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=

      - name: Push to Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix build .#terraformConfiguration -o ./result-config
          nix build .#devShells.x86_64-linux.default -o ./result-devshell
          nix profile install github:zhaofengli/attic/7a19204df10d606c5070e6bb72615c3461900c05#attic-client --fallback
          attic login ops https://cache.zx.dev "$ATTIC_TOKEN"
          attic push ops:ops ./result-config ./result-devshell
