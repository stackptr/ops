name: Approve my PRs

# Approves PRs I author as the teleoid app, so they can auto-merge once CI
# passes; I can't approve my own PRs, and stackptr/ops's "Require approval"
# ruleset applies to them. The job is stackptr/actions's reusable
# approve.yml, reading teleoid's credentials from this repo's main-only
# `approve` environment. pull_request_target runs this file from main, not
# from the PR, so a PR can't change what it calls.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  approve:
    uses: stackptr/actions/.github/workflows/approve.yml@61b09980127796ed52936b6372b6701a0409099d # v1.1.0
    # Environment secrets reach a reusable workflow only with this
    secrets: inherit
