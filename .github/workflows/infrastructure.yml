name: Infrastructure

# Branches and PRs get no credentials. `tofu plan` runs provider code and Nix
# evaluation of whatever it's given, so only main reaches the two main-only
# environments: `plan` (read-only credentials, no reviewer) and `production`
# (write credentials, me as required reviewer).
#
# - PR: check formatting and the flake, and comment with how the rendered
#   config differs from the base branch's.
# - Push to main, or run by hand: plan, then apply that saved plan once
#   approved in `production`.
# - Daily: plan only, failing if live infrastructure differs from main.

on:
  # Every PR, so the required `check` always reports
  pull_request:
  push:
    branches: [main]
    paths:
      - infrastructure/**
      - flake.nix
      - flake.lock
      - Justfile
      - .github/workflows/infrastructure.yml
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time against main; a run waiting for approval holds the queue.
# Drift checks only read, so they get their own group.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.ref
      || github.event_name == 'schedule' && 'drift'
      || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Check flake
        run: nix flake check

      - name: Diff rendered config
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          just diff "$BASE" > config.diff
          {
            if [[ -s config.diff ]]; then
              echo "### Rendered config: changed"
              echo
              echo "<details><summary>Diff against ${GITHUB_BASE_REF} for ${SHA::7}</summary>"
              echo
              echo '```diff'
              head -c 60000 config.diff
              echo '```'
              echo '</details>'
            else
              echo "### Rendered config: unchanged"
            fi
            echo
            echo "Plan and apply run after merge, in the \`plan\` and \`production\` environments."
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last --create-if-none

  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: plan
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_endpoint: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Approving `production` runs this commit's code, not just the plan. Say
      # so on the run page when the push changed what runs with credentials.
      - name: Flag changes to privileged code
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ $BEFORE =~ ^0+$ ]] || ! git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
            echo "::warning::Couldn't diff against the previous commit; review the whole push before approving"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD -- .github flake.nix flake.lock Justfile scripts checks)
          if [[ -n $changed ]]; then
            echo "::warning::This push changes code that runs with credentials: $(paste -sd' ' <<< "$changed")"
            {
              echo "### Changes to code that runs with credentials"
              echo
              echo "Approving \`production\` runs this code, not only the plan. Review it first:"
              echo
              while IFS= read -r file; do echo "- \`$file\`"; done <<< "$changed"
              echo
              echo "[Diff]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init
        run: just init

      # -lock=false: the read-only token can't take the state lock. The saved
      # plan is encrypted (plan encryption is enforced), so it's safe to keep
      # as an artifact.
      - name: Plan
        id: plan
        run: |
          set +e
          tofu -chdir=tofu plan -no-color -lock=false -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          case $code in
            0) result="no changes" ;;
            2) result="changes" ;;
            *) result="failed" ;;
          esac
          {
            echo "### OpenTofu plan: $result"
            echo
            echo "<details><summary>Output for ${GITHUB_SHA::7}</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Upload plan
        if: steps.plan.outputs.exitcode == '2' && github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: tofu/tfplan
          retention-days: 7

      # Changes are expected after a push; on the daily run they mean live
      # infrastructure no longer matches main
      - name: Check result
        env:
          CODE: ${{ steps.plan.outputs.exitcode }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $CODE == 1 ]]; then
            echo "::error::tofu plan failed"
            exit 1
          fi
          if [[ $CODE == 2 && $EVENT == schedule ]]; then
            echo "::error::Drift: live infrastructure differs from main"
            exit 1
          fi

  apply:
    needs: plan
    if: needs.plan.outputs.exitcode == '2' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_endpoint: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: tofu

      - name: Init
        run: just init

      # Applies exactly the plan approved above; if state changed since, tofu
      # rejects it as stale
      - name: Apply
        run: tofu -chdir=tofu apply tfplan
