name: Infrastructure

# Branches and PRs get no credentials. `tofu plan` runs provider code and Nix
# evaluation of whatever it's given, so only main reaches the two main-only
# environments: `plan` (read-only credentials, no reviewer) and `production`
# (write credentials, me as required reviewer).
#
# - PR: check formatting and the flake, and comment with how the rendered
#   config differs from the base branch's.
# - Push to main, or run by hand: plan, then apply that saved plan once
#   approved in `production`.
# - Daily: plan only, failing if live infrastructure differs from main, and
#   check the baseline's repos for repository-level secrets.
# Failures on main post to #alerts.
#
# GitHub credentials are two GitHub Apps installed on the account: a read-only
# one in `plan` and a read-write one in `production`, each as
# OPS_APP_CLIENT_ID (variable) and OPS_APP_PRIVATE_KEY (secret).

on:
  # Every PR, so the required `check` always reports
  pull_request:
  push:
    branches: [main]
    paths:
      - infrastructure/**
      - flake.nix
      - flake.lock
      - Justfile
      - .github/workflows/infrastructure.yml
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time against main; a run waiting for approval holds the queue.
# Drift checks only read, so they get their own group.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.ref
      || github.event_name == 'schedule' && 'drift'
      || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Check flake
        run: nix flake check

      - name: Diff rendered config
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          just diff "$BASE" > config.diff
          {
            if [[ -s config.diff ]]; then
              echo "### Rendered config: changed"
              echo
              echo "<details><summary>Diff against ${GITHUB_BASE_REF} for ${SHA::7}</summary>"
              echo
              echo '```diff'
              head -c 60000 config.diff
              echo '```'
              echo '</details>'
            else
              echo "### Rendered config: unchanged"
            fi
            echo
            echo "Plan and apply run after merge, in the \`plan\` and \`production\` environments."
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last --create-if-none

  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: plan
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_endpoint: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Init
        run: just init

      # -lock=false: the read-only token can't take the state lock. The saved
      # plan is encrypted (plan encryption is enforced), so it's safe to keep
      # as an artifact.
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          tofu -chdir=tofu plan -no-color -lock=false -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          case $code in
            0) result="no changes" ;;
            2) result="changes" ;;
            *) result="failed" ;;
          esac
          {
            echo "### OpenTofu plan: $result"
            echo
            echo "<details><summary>Output for ${GITHUB_SHA::7}</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Upload plan
        if: steps.plan.outputs.exitcode == '2' && github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: tofu/tfplan
          retention-days: 7

      # Changes are expected after a push; on the daily run they mean live
      # infrastructure no longer matches main
      - name: Check result
        env:
          CODE: ${{ steps.plan.outputs.exitcode }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $CODE == 1 ]]; then
            echo "::error::tofu plan failed"
            exit 1
          fi
          if [[ $CODE == 2 && $EVENT == schedule ]]; then
            echo "::error::Drift: live infrastructure differs from main"
            exit 1
          fi

  apply:
    needs: plan
    if: needs.plan.outputs.exitcode == '2' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_endpoint: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: tofu

      - name: Mint GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Init
        run: just init

      # Applies exactly the plan approved above; if state changed since, tofu
      # rejects it as stale
      - name: Apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: tofu -chdir=tofu apply tfplan

  # OpenTofu can't see secrets it doesn't manage, so check that no repo in the
  # baseline has repository-level secrets, which every branch's workflows get
  secrets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check for repository secrets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          found=0
          for repo in $(nix eval --json --file infrastructure/github/repos.nix --apply builtins.attrNames | jq -r '.[]'); do
            names=$(gh api "repos/$OWNER/$repo/actions/secrets" --paginate --jq '.secrets[].name' | paste -sd, -)
            if [[ -n $names ]]; then
              echo "::error::$repo has repository secrets: $names"
              found=1
            fi
          done
          exit $found

  notify:
    needs: [plan, apply, secrets]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      actions: read
    steps:
      - uses: stackptr/actions/slack-notify@8f86bf2d6b69d2225bee5726b080fc6ce1066bd9 # v1.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: "#alerts"
          status: failure
          failed-jobs: true
