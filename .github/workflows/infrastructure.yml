name: Infrastructure

# Branches and PRs get no credentials. `tofu plan` runs provider code and Nix
# evaluation of whatever it's given, so only main reaches the two main-only
# environments: `plan` (no reviewer; read-only state access) and
# `production` (me as required reviewer; writes state and applies).
#
# - PR: check formatting and the flake, and comment with how the rendered
#   config differs from the base branch's.
# - Push to main, or run by hand: plan, then apply that saved plan once
#   approved in `production`.
# - Daily: plan only, failing if live infrastructure differs from main, and
#   check the baseline's repos for repository-level secrets.
# Failures on main post to #alerts.
#
# `plan` has no reviewer, so `classify` keeps code that hasn't run with
# credentials before out of it: when main's flake, Justfile, scripts, checks
# or workflows differ from the last commit whose plan succeeded, the plan and
# secrets jobs run in `production` instead, after my approval.
#
# GitHub credentials are two GitHub Apps installed on the account, teleopsis
# in `plan` and teleozyme in `production`, each as OPS_APP_CLIENT_ID
# (variable) and OPS_APP_PRIVATE_KEY (secret). teleopsis has Administration
# write only so plans can see rulesets' bypass actors (apps.nix).

on:
  # Every PR, so the required `check` always reports
  pull_request:
  push:
    branches: [main]
    paths:
      - infrastructure/**
      - flake.nix
      - flake.lock
      - Justfile
      - .github/workflows/infrastructure.yml
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time against main; a run waiting for approval holds the queue.
# Drift checks only read, so they get their own group.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.ref
      || github.event_name == 'schedule' && 'drift'
      || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Check flake
        run: nix flake check

      - name: Diff rendered config
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          just diff "$BASE" > config.diff

          # Anyone can seal a value with an environment's public key, and the
          # ciphertext shows nothing, so name every sealed secret this PR
          # touches: re-sealing the wrong repo's secret, or a value I didn't
          # seal, then stands out
          file=infrastructure/github/sealed.json
          flatten='[paths(scalars) as $p | {key: ($p | join("/")), value: getpath($p)}] | from_entries'
          before=$(git show "$BASE:$file" 2>/dev/null | jq "$flatten" || echo '{}')
          after=$(jq "$flatten" "$file")
          jq -nr --argjson a "$before" --argjson b "$after" '
            ($a | keys) as $old | ($b | keys) as $new
            | [ ($new - $old)[] | "- added: `\(.)`" ]
              + [ ($old - $new)[] | "- removed: `\(.)`" ]
              + [ $old[] as $k | select(($b | has($k)) and $a[$k] != $b[$k]) | "- changed: `\($k)`" ]
            | .[]' > secrets.md

          {
            if [[ -s secrets.md ]]; then
              echo "### Sealed secrets: $(wc -l < secrets.md | tr -d ' ') touched"
              echo
              cat secrets.md
              echo
              echo "Confirm I sealed each of these myself (\`just seal\`), into the repo and environment named. The ciphertext can't show who sealed it or what it holds."
              echo
            fi
            if [[ -s config.diff ]]; then
              echo "### Rendered config: changed"
              echo
              echo "<details><summary>Diff against ${GITHUB_BASE_REF} for ${SHA::7}</summary>"
              echo
              echo '```diff'
              head -c 60000 config.diff
              echo '```'
              echo '</details>'
            else
              echo "### Rendered config: unchanged"
            fi
            echo
            echo "Plan and apply run after merge, in the \`plan\` and \`production\` environments."
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last --create-if-none

  # Picks the environment for the jobs that run main's code with
  # credentials. `plan` has no reviewer, so a run may use it only if the code
  # those jobs execute (the flake and devShell, Justfile, scripts, checks and
  # workflows) is unchanged since the last commit whose plan succeeded on
  # main; otherwise they run in `production`, after my approval. Comparing
  # against the last successful plan, not the push's parent, means a gated
  # run I reject stays gated for the daily drift check too. No credentials
  # here; it fails closed to `production` when it can't tell.
  classify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.classify.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare against the last successful plan
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          paths=(.github flake.nix flake.lock Justfile scripts checks)
          last=""
          while read -r id sha; do
            [[ $id == "$RUN_ID" ]] && continue
            ok=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "plan" and .conclusion == "success")] | length')
            if [[ $ok -gt 0 ]]; then
              last=$sha
              break
            fi
          done < <(gh api "repos/$REPO/actions/workflows/infrastructure.yml/runs?branch=main&per_page=30" \
            --jq '.workflow_runs[] | select(.event != "pull_request") | "\(.id) \(.head_sha)"')

          environment=production
          if [[ -z $last ]]; then
            reason="no recent run on main has a successful plan to compare against"
          elif ! git fetch -q --no-tags --depth=1 origin "$last"; then
            reason="couldn't fetch ${last::7}, the last commit with a successful plan"
          else
            changed=$(git diff --name-only "$last" HEAD -- "${paths[@]}")
            if [[ -z $changed ]]; then
              environment=plan
            else
              reason="code that runs with credentials changed since ${last::7}, the last commit with a successful plan"
            fi
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

          if [[ $environment == production ]]; then
            echo "::warning::Plan and secrets jobs wait for approval in production: $reason"
            {
              echo "### Code that runs with credentials changed"
              echo
              echo "The plan and secrets jobs wait for approval in \`production\`: $reason."
              echo "Approving runs this commit's code with credentials, not only the plan. Review it first:"
              echo
              if [[ -n ${changed:-} ]]; then
                while IFS= read -r file; do echo "- \`$file\`"; done <<< "$changed"
                echo
                echo "[Diff]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  plan:
    needs: classify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ needs.classify.outputs.environment }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_endpoint: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Init
        run: just init

      # -lock=false: the read-only token can't take the state lock. The saved
      # plan is encrypted (plan encryption is enforced), so it's safe to keep
      # as an artifact.
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          tofu -chdir=tofu plan -no-color -lock=false -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          # Also in the log, which (unlike the summary) the API can read
          cat plan.txt
          case $code in
            0) result="no changes" ;;
            2) result="changes" ;;
            *) result="failed" ;;
          esac
          {
            echo "### OpenTofu plan: $result"
            echo
            echo "<details><summary>Output for ${GITHUB_SHA::7}</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      # Destroying a github_repository deletes the repository (or archives it,
      # with archive_on_destroy). prevent_destroy only guards resources still
      # in the config, so check the plan itself, before anything is uploaded
      # to apply. To stop managing a repo, use a `removed` block with
      # `lifecycle.destroy = false`, which plans a forget rather than a delete (infrastructure/github/repository.nix).
      - name: Refuse to destroy repositories
        if: steps.plan.outputs.exitcode == '2'
        run: |
          destroyed=$(tofu -chdir=tofu show -json tfplan | jq -r '
            .resource_changes[]?
            | select(.type == "github_repository" and (.change.actions | index("delete")))
            | .address')
          if [[ -n $destroyed ]]; then
            echo "::error::The plan destroys or replaces repositories: $(paste -sd' ' <<< "$destroyed")"
            exit 1
          fi

      - name: Upload plan
        if: steps.plan.outputs.exitcode == '2' && github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: tofu/tfplan
          retention-days: 7

      # Changes are expected after a push; on the daily run they mean live
      # infrastructure no longer matches main
      - name: Check result
        env:
          CODE: ${{ steps.plan.outputs.exitcode }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $CODE == 1 ]]; then
            echo "::error::tofu plan failed"
            exit 1
          fi
          if [[ $CODE == 2 && $EVENT == schedule ]]; then
            echo "::error::Drift: live infrastructure differs from main"
            exit 1
          fi

  apply:
    needs: plan
    if: needs.plan.outputs.exitcode == '2' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_endpoint: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: tofu

      - name: Mint GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Init
        run: just init

      # Applies exactly the plan approved above; if state changed since, tofu
      # rejects it as stale
      - name: Apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: tofu -chdir=tofu apply tfplan

  # OpenTofu can't see secrets it doesn't manage, so check that no repo in the
  # baseline has repository-level secrets, which every branch's workflows get
  secrets:
    needs: classify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Its shell is the flake's devShell, so it runs main's code too
    environment: ${{ needs.classify.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check for repository secrets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          found=0
          for repo in $(nix eval --json --file infrastructure/github/repos.nix --apply builtins.attrNames | jq -r '.[]'); do
            names=$(gh api "repos/$OWNER/$repo/actions/secrets" --paginate --jq '.secrets[].name' | paste -sd, -)
            if [[ -n $names ]]; then
              echo "::error::$repo has repository secrets: $names"
              found=1
            fi
          done
          exit $found

  notify:
    needs: [classify, plan, apply, secrets]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      actions: read
    steps:
      - uses: stackptr/actions/slack-notify@8f86bf2d6b69d2225bee5726b080fc6ce1066bd9 # v1.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: "#alerts"
          status: failure
          failed-jobs: true
